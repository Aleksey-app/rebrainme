    "ruff>=0.17.6",
    "uvicorn>=0.54.0",
]

[project.scripts]
weather-proxy-aider = "weather_proxy_aider:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
